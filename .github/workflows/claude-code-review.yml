name: Claude Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: write-all
    env:
      REVIEW_BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
      REVIEW_BRANCH: claude/review-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review ${{ github.repository }} on the checked-out branch.
            Event: ${{ github.event_name }}
            Pull request: ${{ github.event.pull_request.number }}

            Read the codebase, tests, configuration, and documentation to understand
            how the project works. For a pull request, review the diff in that context;
            for a manual run, review the whole codebase.

            Run npm run typecheck, npm test, and npm run build. Exercise all documented
            functionality, including edge cases and error paths, with additional tests
            or local smoke checks as needed. Report anything you could not verify.

            Report concrete bugs, regressions, security issues, and missing test coverage
            with file/line references. If there are actionable findings, create the branch
            in REVIEW_BRANCH from the checked-out commit, implement focused fixes and
            regression tests, and rerun all checks. Commit and push that branch, then open
            a PR against REVIEW_BASE_BRANCH using gh pr create with explicit --repo,
            --base, --head, and --body-file. Describe the findings, fixes, and validation
            results; use a draft PR if anything remains unverified. Do not push directly
            to the reviewed branch, merge, or deploy. If no fixes are needed, do not
            create an empty commit or PR.

            Write the review, check results, and any fix PR URL to GITHUB_STEP_SUMMARY
            and, for a pull request, post them as a comment on the original PR using
            gh pr comment with --repo and --body-file.
          claude_args: '--dangerously-skip-permissions'
