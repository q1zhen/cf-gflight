name: Claude Code Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    if: github.event_name == 'pull_request'
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  claude-codebase-review:
    name: Review codebase and open a PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      REVIEW_BASE_BRANCH: ${{ github.ref_name }}
      REVIEW_BRANCH: claude/codebase-review-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create review branch
        run: git switch -c "$REVIEW_BRANCH"

      - name: Review entire codebase and open a PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.ref_name }}
          prompt: |
            REPOSITORY: ${{ github.repository }}

            Review the entire tracked codebase on the checked-out branch, including
            source, tests, configuration, and documentation. Look for concrete bugs,
            security issues, regressions, and missing coverage. Follow the repository's
            instructions and prioritize findings you can substantiate.

            Implement focused fixes for actionable findings and add regression tests
            where appropriate. Avoid unrelated refactors or cosmetic changes. Run
            npm run typecheck, npm test, and npm run build, and resolve failures caused
            by your changes. Do not deploy the application.

            The new branch in REVIEW_BRANCH is already checked out. Commit your fixes
            there, push that branch, and open one pull request against REVIEW_BASE_BRANCH
            using gh pr create with an explicit --base and --head. Never push directly
            to the base branch or merge the PR. Write the PR body to a file and pass it
            with --body-file. Describe each finding, its impact, the fix, validation
            results, and any remaining issues. Include the PR URL in your final response.

            If there are no actionable findings, report that result without creating
            an empty commit or pull request. If a fix cannot be validated, explain the
            limitation and open the PR as a draft.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(rg:*),Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(npm ci:*),Bash(npm run typecheck:*),Bash(npm test:*),Bash(npm run build:*)"

